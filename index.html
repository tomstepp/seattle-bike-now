<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Riding conditions for Seattle bike commuters: weather, drawbridges, rider counts, and car traffic on the streets bikes share." />
    <title>Seattle Bike Now</title>
    <!-- Start these before the JavaScript arrives; the map and panels need them first. -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="preconnect" href="https://api.weather.gov" crossorigin />
    <link rel="preload" href="data/bike-network.geojson" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="data/bridges.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="data/counters.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="data/collisions.json" as="fetch" crossorigin="anonymous" />
    <link rel="preconnect" href="https://data.seattle.gov" crossorigin />
  </head>
  <body>
    <div id="map"></div>
    <button id="menu-toggle" class="panel" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
        <path class="open-icon" d="M3 5h14M3 10h14M3 15h14" />
        <path class="close-icon" d="M5 5l10 10M15 5L5 15" />
      </svg>
    </button>
    <!-- Phones: the answer stays visible next to the menu button. -->
    <p id="verdict-badge" class="panel verdict-badge" hidden></p>
    <div id="sidebar">
      <header class="panel">
        <h1>Seattle Bike Now</h1>
        <p id="verdict" class="verdict" aria-live="polite"></p>
        <p id="updated"></p>
      </header>
      <div class="panel sections">
        <details id="route">
          <summary><span class="label">Route</span><span class="status">loading…</span></summary>
          <div class="body"></div>
        </details>
        <details id="weather">
          <summary><span class="label">Weather</span><span class="status">loading…</span></summary>
          <div class="body"></div>
        </details>
        <details id="bridges">
          <summary><span class="label">Bridges</span><span class="status">loading…</span></summary>
          <div class="body"></div>
        </details>
        <details id="closures">
          <summary><span class="label">Closures</span><span class="status">loading…</span></summary>
          <div class="body"></div>
        </details>
        <details id="riders">
          <summary><span class="label">Riders</span><span class="status">loading…</span></summary>
          <div class="body"></div>
        </details>
        <details id="crashes">
          <summary><span class="label">Crashes</span><span class="status">loading…</span></summary>
          <div class="body"></div>
        </details>
        <details id="layers">
          <summary><span class="label">Layers</span><span class="status">loading…</span></summary>
          <div class="body"></div>
        </details>
        <details id="legend">
          <summary><span class="label">Map key</span><span class="status">what the colors mean</span></summary>
          <div class="body"></div>
        </details>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
